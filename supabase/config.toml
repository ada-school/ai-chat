# Minimal Supabase CLI config. The CLI fills in defaults for everything else.
# See https://supabase.com/docs/guides/local-development/cli/config
project_id = "ai-chat"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:4173"]
# v1 signs every visitor in anonymously so RLS can scope data per device.
enable_anonymous_sign_ins = true

[functions.chat]
verify_jwt = true
